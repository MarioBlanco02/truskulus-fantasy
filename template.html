<style>
/* Layout: columna móvil (iOS), fondo de campo difuminado, tarjetas Liquid Glass, tab bar flotante de 5 pestañas */
:root{
  --bg:#e9f1ec; --fg:#0e1a14; --muted:#5a6b62;
  --accent:#12b76a; --accent-fg:#04210f; --warn:#e5484d; --gold:#e8a317; --up:#12a35f; --down:#e5484d;
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78);
  --edge:rgba(255,255,255,.85); --edge-dim:rgba(14,26,20,.08);
  --shadow:0 10px 30px rgba(20,60,40,.14);
  --blob1:#7fe3ae; --blob2:#9bd0ff; --blob3:#ffe39a;
  --pitch-a:#1f9d5c; --pitch-b:#178a50; --pitch-line:rgba(255,255,255,.55);
  --display:"Bricolage Grotesque",-apple-system,"SF Pro Display","Helvetica Neue",sans-serif;
  --body:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07120d; --fg:#eef6f1; --muted:#8fa399;
  --accent:#34d98b; --accent-fg:#03180d; --warn:#ff6b70; --gold:#f5bd45; --up:#34d98b; --down:#ff6b70;
  --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.13);
  --edge:rgba(255,255,255,.2); --edge-dim:rgba(255,255,255,.06);
  --shadow:0 12px 34px rgba(0,0,0,.45);
  --blob1:#0f6b44; --blob2:#12456e; --blob3:#5a4310;
  --pitch-a:#14663d; --pitch-b:#115a36; --pitch-line:rgba(255,255,255,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07120d; --fg:#eef6f1; --muted:#8fa399;
  --accent:#34d98b; --accent-fg:#03180d; --warn:#ff6b70; --gold:#f5bd45; --up:#34d98b; --down:#ff6b70;
  --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.13);
  --edge:rgba(255,255,255,.2); --edge-dim:rgba(255,255,255,.06);
  --shadow:0 12px 34px rgba(0,0,0,.45);
  --blob1:#0f6b44; --blob2:#12456e; --blob3:#5a4310;
  --pitch-a:#14663d; --pitch-b:#115a36; --pitch-line:rgba(255,255,255,.4);
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-block:0 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 40% at 15% 8%,var(--blob1),transparent 70%),
             radial-gradient(55% 40% at 90% 30%,var(--blob2),transparent 70%),
             radial-gradient(60% 45% at 30% 95%,var(--blob3),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-top:14px}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid var(--edge-dim);box-shadow:var(--shadow),inset 0 1px 0 var(--edge);border-radius:26px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{font-size:12px;color:var(--muted)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:25px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 12px;padding:6px 4px 0}
.badge{font-size:11px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--glass);border:1px solid var(--edge-dim);color:var(--muted);white-space:nowrap}
.card{padding:18px;display:grid;gap:14px}
.sec{padding:16px 16px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}

/* escudos y fotos */
.crest{--s:44px;width:var(--s);height:var(--s);flex:none;display:grid;place-items:center;border-radius:28%;overflow:hidden;
  font-family:var(--display);font-weight:800;font-size:calc(var(--s)*.36);color:#fff;letter-spacing:-.02em}
.crest img{width:100%;height:100%;object-fit:contain;display:block}
.crest.fb{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25)}
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:calc(var(--s)*.36);
  background:var(--glass-strong);border:1px solid var(--edge-dim);flex:none;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.posdot{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:99px;color:#fff}
.p-POR{background:#e0912b}.p-DEF,.p-LAT{background:#3b82f6}.p-MED{background:#16a765}.p-DEL{background:#e5484d}

/* hero partido */
.hero{padding:20px 18px 16px;display:grid;gap:16px;position:relative;overflow:hidden}
.hero .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.hero .t{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.hero .t b{font-family:var(--display);font-size:15px;line-height:1.15;overflow-wrap:anywhere}
.hero .mid{display:flex;flex-direction:column;align-items:center;gap:2px}
.hero .mid .num{font-size:26px;font-weight:800;line-height:1}
.hero .score{font-size:34px}
.cd{font-size:30px;font-weight:800;letter-spacing:-.02em}
.meta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{font-size:12px;padding:6px 11px;border-radius:99px;background:var(--glass-strong);border:1px solid var(--edge-dim)}
.pill.ok{background:var(--accent);color:var(--accent-fg);border-color:transparent;font-weight:700}
.dots{display:inline-flex;gap:4px;vertical-align:middle}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.dot.w{background:var(--up)}.dot.l{background:var(--down)}.dot.d{background:var(--gold)}
.rivalrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding-top:12px;border-top:1px solid var(--edge-dim)}

/* presupuesto */
.meter{height:10px;border-radius:99px;background:var(--glass-strong);overflow:hidden;border:1px solid var(--edge-dim)}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .3s}
.meter.over i{background:var(--warn)}

/* campo */
.pitch{position:relative;padding:18px 10px 16px;border-radius:26px;overflow:hidden;
  background:repeating-linear-gradient(0deg,var(--pitch-a) 0 44px,var(--pitch-b) 44px 88px);
  box-shadow:var(--shadow),inset 0 1px 0 var(--edge);border:1px solid var(--edge-dim)}
.pitch::before{content:"";position:absolute;inset:10px;border:1.5px solid var(--pitch-line);border-radius:14px;pointer-events:none}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px;border:1.5px solid var(--pitch-line);border-radius:50%;pointer-events:none}
.line{position:relative;z-index:1;display:flex;justify-content:space-around;margin:0 0 18px}
.line:last-child{margin-bottom:0}
.slot{width:78px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.shirt{--s:54px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;
  background:rgba(255,255,255,.18);border:1.5px dashed rgba(255,255,255,.7);color:#fff;overflow:hidden;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .15s}
.shirt img{width:100%;height:100%;object-fit:cover}
.slot.filled .shirt{background:#fff;color:#0b3b22;border:2.5px solid #fff;box-shadow:0 6px 14px rgba(0,0,0,.25)}
.slot:active .shirt{transform:scale(.94)}
.slot .nm{font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);text-align:center;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .ln{font-size:10px;color:rgba(255,255,255,.8);letter-spacing:.06em;font-weight:600}
.cap{position:absolute;top:-4px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#2a1d00;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;z-index:2}
.slot[disabled]{cursor:default}

/* botones y controles */
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:14px 16px;flex-wrap:wrap}
.btn{padding:12px 20px;border-radius:99px;font-weight:700;background:var(--accent);color:var(--accent-fg);box-shadow:0 6px 16px rgba(18,183,106,.35);text-align:center}
.btn[disabled]{opacity:.4;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--glass-strong);color:var(--fg);box-shadow:none;border:1px solid var(--edge-dim)}
.seg{display:flex;gap:6px;padding:4px;border-radius:99px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;min-height:36px;padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;text-align:center}
.seg button[aria-pressed="true"]{background:var(--glass-strong);color:var(--accent);box-shadow:inset 0 1px 0 var(--edge)}
.chipsel{display:flex;gap:8px;flex-wrap:wrap}
.chipsel button{padding:7px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--edge-dim);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.chipsel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:transparent}

/* listas */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--edge-dim);width:100%}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.me{background:var(--glass-strong)}
.row[disabled]{opacity:.4;cursor:not-allowed}
.pts{font-family:var(--display);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;text-align:right;min-width:42px}
.pts.neg,.neg{color:var(--warn)}
.val{text-align:right;min-width:62px}
.val b{font-family:var(--display);font-size:16px;display:block}
.delta{font-size:11px;font-weight:700}
.delta.up{color:var(--up)}.delta.dn{color:var(--down)}.delta.eq{color:var(--muted)}
.spark{width:56px;height:24px;flex:none}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--glass-strong);border:1px solid var(--edge-dim)}
.chip.neg{color:var(--warn)}
.rank{width:26px;text-align:center;font-family:var(--display);font-weight:800;color:var(--muted)}
.rank.top3{color:var(--gold)}
.tablewrap{overflow-x:auto;padding:0 6px 10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:6px 4px}
td{padding:8px 4px;text-align:center;border-top:1px solid var(--edge-dim);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.me td{background:var(--glass-strong);font-weight:700}
td .tn{display:flex;align-items:center;gap:8px;min-width:130px}
.rules{padding:6px 16px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px}
.rules span:nth-child(even){text-align:right;font-weight:700;font-family:var(--display)}
.rules span{padding:6px 0;border-top:1px solid var(--edge-dim)}
.note{font-size:12px;color:var(--muted);padding:0 6px}
.empty{padding:22px 18px;text-align:center;display:grid;gap:6px;justify-items:center}
.movers{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.mv{display:flex;align-items:center;gap:8px;padding:8px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--edge-dim);min-width:0;width:100%}
.mv .grow{min-width:0;flex:1}
.mv b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.matchrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--edge-dim);font-size:13px}
.matchrow:first-child{border-top:0}
.matchrow .tm{display:flex;align-items:center;gap:8px;min-width:0}
.matchrow .tm.r{justify-content:flex-end;text-align:right}
.matchrow .tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.matchrow .mid{text-align:center;font-family:var(--display);font-weight:800;min-width:64px;font-size:15px}
.matchrow .mid small{display:block;font-family:var(--body);font-weight:500;color:var(--muted);font-size:10px}

/* tab bar y hojas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:0 max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.tabs nav{pointer-events:auto;display:flex;gap:2px;padding:6px;width:100%;max-width:460px;border-radius:99px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:99px;font-size:10.5px;font-weight:600;color:var(--muted);transition:background .2s,color .2s;text-align:center}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{background:var(--glass-strong);color:var(--accent);box-shadow:inset 0 1px 0 var(--edge)}
.scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:480px;max-height:86%;overflow:auto;border-radius:28px 28px 0 0;background:var(--bg);
  padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.9,.3,1);border-bottom:0}
.sheet .grab{width:38px;height:5px;border-radius:9px;margin:8px auto 4px;background:var(--muted);opacity:.4}
.profile{display:grid;gap:14px;padding:14px 16px 8px;justify-items:center;text-align:center}
.bigav{--s:96px}
.avbtn{position:relative;cursor:pointer;display:inline-block}
.avbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.avbtn .cam{position:absolute;right:-2px;bottom:-2px;min-width:26px;height:26px;padding:0 8px;border-radius:99px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:11px;font-weight:800;border:2px solid var(--bg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.stat{padding:10px 4px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--edge-dim)}
.stat b{display:block;font-family:var(--display);font-size:18px}
.bigspark{width:100%;height:80px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;padding:10px 16px;border-radius:99px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.field{width:100%;padding:14px;border-radius:16px;border:1px solid var(--edge-dim);background:var(--glass-strong);color:var(--fg);font:inherit;font-size:22px;letter-spacing:.5em;text-align:center}
.sel{width:100%;padding:11px 12px;border-radius:14px;border:1px solid var(--edge-dim);background:var(--glass-strong);color:var(--fg);font:inherit;font-size:15px}
.sel option{color:#111}
.votelabel{display:grid;gap:6px}
.evrow{flex-wrap:wrap}
.evsteps{display:flex;gap:8px;width:100%;justify-content:space-between}
.step2{display:grid;gap:4px;justify-items:center}
.stepper{display:flex;align-items:center;gap:4px;background:var(--glass-strong);border:1px solid var(--edge-dim);border-radius:99px;padding:2px}
.stepper button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:700;text-align:center;background:var(--glass)}
.stepper button[disabled]{opacity:.3;cursor:not-allowed}
.stepper b{min-width:22px;text-align:center;font-family:var(--display);font-variant-numeric:tabular-nums}
.cards{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.cardbtn{flex:none;scroll-snap-align:start;padding:0;line-height:0}
.cardbtn img,.cardbtn .ph{width:152px;aspect-ratio:600/880;border-radius:14px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
.cardbtn .ph{background:var(--glass-strong);display:block}
.cardback{flex:none;width:152px;aspect-ratio:600/880;border-radius:14px;display:grid;place-items:center;border:2px solid var(--gold);
  background:linear-gradient(160deg,#1f1a0f,#0a0805);box-shadow:0 8px 14px rgba(0,0,0,.35),inset 0 0 30px rgba(241,210,122,.15)}
.cardback b{font-family:var(--display);font-size:64px;color:var(--gold)}
.bigcard{width:min(300px,78vw);aspect-ratio:600/880;filter:drop-shadow(0 14px 26px rgba(0,0,0,.5))}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
/* ── Datos de Liga Elite Fútbol (los genera scrape.py) ── */
const DATA = /*DATA*/;

/* ── Reglas del juego ── */
const VOTE_DAYS = 3, EVENT_DAYS = 7;   // plazo para votar el MVP y para apuntar eventos, desde el inicio del partido
const START_JORNADA = 4;           // los puntos del fantasy empiezan a contar aquí; J2 y J3 solo calibran el mercado
const BUDGET_FACTOR = 1.05;        // el presupuesto es el coste medio de 7 jugadores +5 %, y se recalcula con el mercado
let BUDGET = 39;                   // M€ para el 7 inicial (se ajusta en computeBudget)
const VALUE0 = 5.0, VALUE_MIN = 1.0, VALUE_MAX = 25;
const MVP_BONUS = [3,2,1];          // 1.º, 2.º y 3.º más votados del partido
const MAX_ENCAJADOS = 2;           // "portería a cero" cuenta si encajamos 2 goles o menos
const POINTS = {juega:2, gol:4, golDEF:2, golPOR:4, asist:3, porteria:3, mvp:3, amarilla:-1, roja:-3, ausente:-3};
const RULES = [["Juega el partido","+2"],["Gol","+4"],["Gol jugando de defensa / portero","+2 / +4 extra"],["Asistencia","+3"],["Portería a cero: 2 goles o menos (de POR o DEF)","+3"],["MVP (el más votado)","+3"],["2.º más votado","+2"],["3.º más votado","+1"],["Tarjeta amarilla","-1"],["Tarjeta roja","-3"],["Está en tu 7 y no se presenta","-3"],["Capitán","puntos x2"]];
const POS = {POR:"Portero",DEF:"Defensa central",LAT:"Lateral",MED:"Centrocampista",DEL:"Delantero"};
const POS_CORTO = {POR:"POR",DEF:"CEN",LAT:"LAT",MED:"MED",DEL:"DEL"};
// Cada jugador tiene 1 o 2 posiciones (clave: nombre y apellido sin tildes). Se cambian aquí y se publica.
const POSICIONES = {
  "arturo torres":["POR"], "mario blanco":["MED","LAT"], "adrian carmena":["DEF","DEL"], "adrian exposito":["MED"],
  "mario jimeno":["LAT","MED"], "ruben san felipe":["DEF"], "guillermo duran":["MED","LAT"], "mario secilla":["MED","LAT"],
  "adrian sanchez":["LAT","MED"], "jorge perez":["DEF","MED"], "jorge rodriguez":["LAT","DEL"], "jaime montero":["MED","DEL"],
  "guillermo garrido":["MED","DEL"], "alejandro sanchez":["MED","DEF"], "mario camacho":["DEL"]
};
// Huecos de cada formación. MEDB = interior por la banda (admite lateral y extremo); MEDC = centrocampista de centro.
const FORMS = {
  "2-3-1":["POR","DEF","DEF","MEDB","MEDC","MEDB","DEL"], "3-2-1":["POR","DEF","DEF","DEF","MEDC","MEDC","DEL"],
  "2-2-2":["POR","DEF","DEF","MEDB","MEDB","DEL","DEL"], "3-1-2":["POR","DEF","DEF","DEF","MEDC","DEL","DEL"],
  "1-3-2":["POR","DEF","MEDB","MEDC","MEDB","DEL","DEL"]

function madrid(day,time){                    // "2026-11-08","17:00:00" → milisegundos UTC (hora de Madrid, con cambio de horario)
  const y=+day.slice(0,4), lastSun=m=>{const x=new Date(Date.UTC(y,m+1,0));x.setUTCDate(x.getUTCDate()-x.getUTCDay());return x.getTime()+3600e3};
  const start=lastSun(2), end=lastSun(9), t=Date.parse(day+"T"+time+"Z"), summer=t-2*3600e3;
  return summer>=start&&summer<end?summer:t-3600e3;
}

}
function voteBonus(j){                         // Map jugador → {bonus, lugar} con la votación cerrada; null = usar el MVP de la liga

  return out;
}

function scoreOf(p,m){
  const r=(DATA.estadisticas[m.matchId]||[]).find(x=>x.userId===p.id);
  if(!r||!r.jugo) return injuredAt(p.id,m.jornada)?{pts:0,ev:["Lesionado"],ausente:false,lesion:true}:{pts:POINTS.ausente,ev:[],ausente:true};
  const conc=m.esLocal?m.golesVisitante:m.golesLocal;
  const ov=k=>EVMAP[m.jornada+":"+p.id+":"+k];
  const asist=ov("asist")??r.asistencias, amar=ov("amarilla")??r.amarillas, roja=ov("roja")??r.rojas;
  const vb=voteBonus(m.jornada), vv=vb?vb.get(p.id):(r.mvp?{bonus:MVP_BONUS[0],lugar:1}:null);
  let pts=POINTS.juega, ev=[];
  if(r.goles){pts+=r.goles*POINTS.gol;ev.push(r.goles+(r.goles>1?" goles":" gol"))}
  if(asist){pts+=asist*POINTS.asist;ev.push(asist+" asist.")}
  if(vv){pts+=vv.bonus;ev.push(vv.lugar===1?"MVP":vv.lugar+".º más votado")}
  if(amar){pts+=amar*POINTS.amarilla;ev.push(amar+" amarilla"+(amar>1?"s":""))}
  if(roja){pts+=roja*POINTS.roja;ev.push(roja>1?roja+" rojas":"Roja")}
  return {pts,ev,ausente:false,goles:r.goles,asist,cs:conc<=MAX_ENCAJADOS};
}

function compute(){

  PLAYED.forEach(m=>bestOfRound(m.jornada).forEach((r,i)=>r.p.cards.push({j:m.jornada,place:i+1,ed:editionFor(m.jornada)})));

  P.forEach(p=>{

    // valor de mercado: sube o baja con cada partido jugado, también J2 y J3
    let v=VALUE0; p.hist=[VALUE0];

      x.delta=(x.lesion?0:x.ausente?-0.5:clamp((x.pts-3)*0.25,-1.5,2.5))+(card?CARD_BONUS[card.place-1]:0);
      v=clamp(Math.round((v+x.delta)*10)/10,VALUE_MIN,VALUE_MAX); x.value=v; p.hist.push(v);
    });

    const count=p.log.filter(x=>x.m.jornada>=START_JORNADA);

    p.pre=sum(pre.map(x=>x.pts)); p.avg=pre2.length?sum(pre2.map(x=>x.pts))/pre2.length:0;

function eligible(p,role){

// ¿se pueden rellenar estos huecos con jugadores libres por no más de "limit" M€?
function canFill(idxs,used,limit){
  const roles=idxs.map(slotRole), cands=roles.map(r=>P.filter(p=>eligible(p,r)&&!used.has(p.id)).sort((a,b)=>a.value-b.value));
  const order=[...roles.keys()].sort((a,b)=>cands[a].length-cands[b].length), taken=new Set(used);
  let ok=false;
  (function go(k,cost){
    if(ok||cost>limit+1e-9) return;
    if(k===order.length){ok=true;return}
    for(const p of cands[order[k]]){ if(taken.has(p.id)) continue; taken.add(p.id); go(k+1,cost+p.value); taken.delete(p.id); if(ok) return }
  })(0,0);
  return ok;
}

  });

}

  const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,ed.dark[0]);bg.addColorStop(.6,ed.dark[1]);bg.addColorStop(1,ed.dark[2]);g.fillStyle=bg;g.fillRect(0,0,W,H);
  const gl=g.createRadialGradient(W/2,640,40,W/2,640,820);gl.addColorStop(0,`rgba(${ed.glow},.42)`);gl.addColorStop(1,`rgba(${ed.glow},0)`);g.fillStyle=gl;g.fillRect(0,0,W,H);
  decorate(g,ed,seed);
}

  const cw=680,ch=cw*880/600,x0=(W-cw)/2,y0=205;

  const best=entriesFor(j), ed=editionFor(j), m=matchOf(j), key="insta|"+j+"|"+best.map(r=>r.p.id+":"+ovrAt(r.p,j)).join(",")+"|"+ed.label;

  g.font='700 38px '+F;g.fillStyle="#fff";g.fillText("JORNADA "+j+" · "+TEAM.toUpperCase(),W/2,212);try{g.letterSpacing="0px"}catch(e){}
  const n=cards.length||1, cw=n===1?600:500, ch=cw*880/600, gap=36, total=n*cw+(n-1)*gap, y0=300;
  cards.forEach((cd,i)=>{const x0=(W-total)/2+i*(cw+gap);g.save();g.shadowColor="rgba(0,0,0,.6)";g.shadowBlur=40;g.shadowOffsetY=18;g.drawImage(cd.canvas,x0,y0,cw,ch);g.restore()});
  g.fillStyle="#fff";g.font='800 52px '+F;g.fillText(m.local+"  "+m.golesLocal+" – "+m.golesVisitante+"  "+m.visitante,W/2,H-150);
  g.fillStyle=ed.text;g.font='700 30px '+F;try{g.letterSpacing="3px"}catch(e){}g.fillText("FANTASY "+TEAM.toUpperCase(),W/2,H-92);try{g.letterSpacing="0px"}catch(e){}
  const url=c.toDataURL("image/png"); CARDS.set(key,{url,canvas:c}); return CARDS.get(key);

/* ── Render e interacción ── */
function render(){
  const gate=CLOUD&&!ME;
  document.getElementById("app").innerHTML=gate?viewLogin():head()+({home:viewHome,lineup:viewLineup,market:viewMarket,rank:viewRank,liga:viewLiga})[tab]();
  document.querySelector(".tabs").hidden=gate;
  if(!gate) hydrateCards();
  document.getElementById("tabs").innerHTML=TABS.map(([k,l,ic])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${tab===k}">${ic}${l}</button>`).join("");
}
function sheet(html){document.getElementById("layer").innerHTML=html?`<div class="scrim" data-act="close"><div class="sheet glass" role="dialog">${html}</div></div>`:"";if(html)hydrateCards()}
let pickIdx=null;
function resizePhoto(file,cb){
  const img=new Image(), url=URL.createObjectURL(file);
  img.onload=()=>{const s=192,c=document.createElement("canvas");c.width=c.height=s;
    const side=Math.min(img.width,img.height);c.getContext("2d").drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,s,s);
    URL.revokeObjectURL(url);cb(c.toDataURL("image/jpeg",.82))};
  img.src=url;
}
document.addEventListener("change",e=>{
  const f=e.target.closest("[data-photo]"); if(!f||!f.files[0])return;
  resizePhoto(f.files[0],async d=>{
    if(CLOUD){const{error}=await sb.from("members").update({photo:d}).eq("id",ME.id);if(error){toast("No se pudo subir la foto");return}ME.photo=d}
    S.photos[f.dataset.photo]=d;CARDS.clear();persist();render();sheet(profile(+f.dataset.photo));
  });
});
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-slot],[data-pick],[data-act],[data-j],[data-join],[data-ev],[data-gotovote],[data-card],[data-sharecard],[data-sharepost],[data-insta],[data-shareinsta],[data-form],[data-cap],[data-injure],[data-heal],[data-mf],[data-ms],[data-rv],[data-player]"); if(!t)return;
  const d=t.dataset;
  if(d.act==="close"){ if(t.classList.contains("scrim")&&e.target.closest(".sheet"))return; sheet(""); return }
  if(d.tab){tab=d.tab;sheet("");render();window.scrollTo(0,0)}
  else if(d.player){sheet(profile(+d.player))}
  else if(d.injure){setInjury(+d.injure,true)}
  else if(d.heal){setInjury(+d.heal,false)}
  else if(d.slot!==undefined&&!t.disabled){pickIdx=+d.slot;sheet(pickSheet(pickIdx))}
  else if(d.pick!==undefined&&!t.disabled){S.slots[pickIdx]=+d.pick||null;if(!S.slots.includes(S.cap))S.cap=null;persist();sheet("");render()}
  else if(d.form&&!t.disabled){S.form=d.form;reconcile();persist();render()}
  else if(d.cap&&!t.disabled){S.cap=+d.cap;persist();render()}
  else if(d.mf){mfilter=d.mf;render()}
  else if(d.ms){msort=d.ms;render()}
  else if(d.rv){rankView=d.rv;render()}
  else if(d.j){jsel=+d.j;render()}
  else if(d.act==="lock"){S.locked=true;persist();render()}
  else if(d.act==="unlock"){S.locked=false;persist();render()}
  else if(d.act==="logout"){logout()}
  else if(d.act==="vote"){sendVote()}
  else if(d.insta){openInsta(+d.insta)}
  else if(d.shareinsta){shareInsta(+d.shareinsta)}
  else if(d.act==="copyinsta"){copyInsta()}
  else if(d.card){openCard(d.card)}
  else if(d.sharecard){shareCard(d.sharecard)}
  else if(d.sharepost){sharePost(d.sharepost)}
  else if(d.gotovote){tab="rank";rankView="jor";jsel=+d.gotovote;render();window.scrollTo(0,0)}
  else if(d.ev&&!t.disabled){const[j,pid,k,dl]=d.ev.split(":");changeEvent(+j,+pid,k,+dl)}
  else if(d.join){sheet(joinSheet(+d.join))}
  else if(d.act==="clear"){S.slots=slotPlan().map(()=>null);S.cap=null;persist();render()}
});
function persistLocal(){S.events=EVENTS;S.votes=VOTES;persist()}
async function changeEvent(j,pid,kind,delta){
  const m=matchOf(j), r=DATA.estadisticas[m.matchId].find(x=>x.userId===pid);
  const base=kind==="asist"?r.asistencias:kind==="amarilla"?r.amarillas:r.rojas;
  const cur=EVMAP[j+":"+pid+":"+kind]; const qty=Math.max(0,Math.min(20,(cur===undefined?base:cur)+delta));
  const row={jornada:j,player_id:pid,kind,qty,by_member:meRow().id};
  if(CLOUD){const{error}=await sb.from("events").upsert(row,{onConflict:"jornada,player_id,kind"});if(error){toast(eventsOpen(j)?"No se pudo guardar":"El plazo para apuntar ha terminado");return}}
  const i=EVENTS.findIndex(e=>e.jornada===j&&e.player_id===pid&&e.kind===kind);
  if(i>=0)EVENTS[i]=row;else EVENTS.push(row);
  if(!CLOUD)persistLocal();
  compute();render();
}
async function sendVote(){
  const j=jsel, v={first:+document.getElementById("v-first").value,second:+document.getElementById("v-second").value,third:+document.getElementById("v-third").value};
  if(!v.first||!v.second||!v.third){toast("Elige a los tres");return}
  if(new Set([v.first,v.second,v.third]).size<3){toast("No puedes repetir jugadores");return}
  const row={jornada:j,voter:meRow().id,...v};
  if(CLOUD){const{error}=await sb.from("votes").upsert(row,{onConflict:"jornada,voter"});if(error){toast(voteOpen(j)?"No se pudo guardar el voto":"La votación ya ha cerrado");return}}
  const i=VOTES.findIndex(x=>x.jornada===j&&x.voter===row.voter);
  if(i>=0)VOTES[i]=row;else VOTES.push(row);
  if(!CLOUD)persistLocal();
  toast("Voto guardado");compute();render();
}
async function setInjury(pid,on){
  if(on){
    const since=+document.getElementById("inj-from").value, row={player_id:pid,since,until:null};
    if(CLOUD){const{error}=await sb.from("injuries").insert({...row,set_by:ME.id});if(error){toast("No se pudo guardar");return}}
    INJ=INJ.filter(r=>!(r.player_id===pid&&r.since===since)); INJ.push(row);
  }else{
    const until=NEXT.jornada-1;
    if(CLOUD){const{error}=await sb.from("injuries").update({until}).eq("player_id",pid).is("until",null);if(error){toast("No se pudo guardar");return}}
    INJ.forEach(r=>{if(r.player_id===pid&&r.until==null)r.until=until});
  }
  if(!CLOUD){S.injuries=INJ;persist()}
  compute();reconcile();persist();render();sheet(profile(pid));toast(on?"Marcado como lesionado":"Marcado como recuperado");
}

document.addEventListener("submit",async e=>{
  const f=e.target.closest("[data-login]"); if(!f)return; e.preventDefault();

async function logout(){await sb.auth.signOut();ME=null;S.slots=[];S.cap=null;S.locked=false;CLAIMED=(await sb.rpc("claimed_players")).data||[];sheet("");render()}
async function loadCloud(){
  const[ms,js,ls,u,evs,vts,inj]=await Promise.all([sb.from("members").select("id,player_id,pos,photo"),sb.from("jornadas").select("jornada,kickoff"),
    sb.from("lineups").select("member_id,jornada,formation,slots,captain,confirmed"),sb.auth.getUser(),
    sb.from("events").select("jornada,player_id,kind,qty,by_member"),sb.from("votes").select("jornada,voter,first,second,third"),
    sb.from("injuries").select("player_id,since,until")]);
  EVENTS=evs.data||[]; VOTES=vts.data||[]; INJ=inj.data||[]; JK={}; (js.data||[]).forEach(j=>{JK[j.jornada]=new Date(j.kickoff).getTime()});
  MEMBERS=ms.data||[]; LINEUPS=(ls.data||[]).map(l=>({...l,slots:(l.slots||[]).map(x=>x||null)}));

async function saveLineup(){

  toast(error?(closed()?"El 7 ya está cerrado":"No se pudo guardar. Inténtalo otra vez"):(S.locked?"7 confirmado":"Guardado"));

function lineupPoints(l){
  const m=PLAYED.find(x=>x.jornada===l.jornada); if(!m)return null;
  const plan=planFor(l.formation);
  return sum(l.slots.map((id,i)=>{const p=id&&byId(id),x=p&&p.log.find(y=>y.m.matchId===m.matchId);return x?(x.pts+slotBonus(x,plan[i]))*(id===l.captain?2:1):0}));
}
function standings(){
  const by=new Map(MEMBERS.map(m=>[m.id,{m,p:byId(m.player_id),total:0,last:null,lj:0}]));
  LINEUPS.filter(l=>l.confirmed&&l.jornada>=START_JORNADA).forEach(l=>{
    const pts=lineupPoints(l),r=by.get(l.member_id); if(pts==null||!r)return;
    r.total+=pts; if(l.jornada>r.lj){r.lj=l.jornada;r.last=pts}
  });
  return [...by.values()].filter(r=>r.p).sort((a,b)=>b.total-a.total||a.p.n.localeCompare(b.p.n));
}
function viewManagers(){
  const r=standings(), any=r.some(x=>x.lj);

  const rows=r.map((x,i)=>`<div class="row ${x.m.id===(ME&&ME.id)?"me":""}"><span class="rank ${any&&i<3?"top3":""}">${i+1}</span><div class="av">${faceOf(x.p,x.p.num)}</div>

  return head+(any?"":`<p class="sub" style="padding:0 16px">Los puntos empiezan a contar en la Jornada ${START_JORNADA}. Confirma tu 7 antes del partido.</p>`)+`<div class="list">${rows}</div></section>`;
}
